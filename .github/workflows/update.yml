name: nightly-update
on:
  schedule:
    - cron: '30 23 * * 0-4'   # 23:30 UTC = 08:30 KST (월~금, 국내장 시작 전)
    - cron: '00 07 * * 1-5'   # 07:00 UTC = 16:00 KST (월~금, 국내장 종료 후)
    - cron: '30 12 * * 0-5'   # 12:30 UTC = 21:30 KST (일~금)
    - cron: '50 14 * * 0-5'   # backup: 14:50 UTC = 23:50 KST (GitHub schedule miss 보완)
  workflow_dispatch:

# 로컬 launchd writer(scripts/update_toss_market_dashboard.sh)와 같은 main/data.json을 쓴다.
# 같은 워크플로 중복 실행은 직렬화하고, push 전 원격 최신 위로 rebase해 non-ff 거절을 줄인다(force 없음).
concurrency:
  group: market-dashboard-data-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: run deterministic tests
        run: python3 -m unittest discover -s tests -v
      - name: fetch data + build
        run: |
          python3 fetch_data.py
          python3 generate.py
          cp dashboard.html index.html
      - name: verify freshness
        run: |
          python3 - <<'PY'
          import json, datetime, pathlib, sys
          today = datetime.datetime.now(datetime.timezone.utc).astimezone(
              datetime.timezone(datetime.timedelta(hours=9))
          ).date().isoformat()
          data = json.loads(pathlib.Path('data.json').read_text())
          as_of = data.get('asOf')
          if as_of != today:
              print(f'freshness check failed: asOf={as_of}, today_kst={today}')
              sys.exit(1)
          print(f'freshness ok: asOf={as_of}')
          # 경고만(실패 아님): asOf는 페이지 생성일일 뿐 수급 최신을 뜻하지 않는다
          import kr_flows as kf
          now = kf.parse_generated(data)
          st = kf.flows_freshness(data.get('kr', {}).get('flows', {}), now)
          print(f"::warning::kr.flows state={st['state']} src={st['src']} expected={st['expected']}" if st['state'] != 'fresh'
                else f"kr.flows fresh src={st['src']}")
          PY
      - name: commit
        run: |
          git config user.name "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "auto update $(TZ=Asia/Seoul date +%F)" || echo "no change"
          for i in 1 2 3; do
            if git pull --rebase origin main; then git push && exit 0; else git rebase --abort || true; fi
            echo "push retry $i"; sleep 5
          done
          exit 1
